# =============================================================
#  compose.yml
#
#  Services:
#    postgres  — PostgreSQL 17  (bot database)
#    lavalink  — Lavalink 4.2.2 (music node)
#
#  Usage:
#    docker compose up -d               # start both in background
#    docker compose logs -f lavalink    # tail lavalink output
#    docker compose down                # stop (volumes kept)
#    docker compose down -v             # stop + delete all data
#
#  The bot runs outside Docker:
#    uv run python bot/bot.py
# =============================================================

# NOTE: 'version' is obsolete in Compose v2 — omit it to silence the warning.

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: discord_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpassword
      POSTGRES_DB: discordbot
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind only to localhost — never expose 5432 publicly on a VPS.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d discordbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ── Lavalink 4.2.2 ───────────────────────────────────────────
  lavalink:
    # Alpine variant: same JVM, ~40% smaller image.
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    container_name: discord_bot_lavalink
    restart: unless-stopped
    environment:
      # Passed through to Spring Boot's ${VAR:default} interpolation in
      # application.yml so credentials never need to be hard-coded there.
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Increase heap (-Xmx) if Lavalink OOM-kills on large queues.
      - _JAVA_OPTIONS=-Xmx512m -XX:+UseG1GC
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # Plugin JARs are downloaded on first start and cached here.
      # Survives container rebuilds; delete to force a plugin re-download.
      - lavalink_plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          wget --no-verbose --tries=1 --spider
          http://localhost:2333/version || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot downloads plugin JARs — allow extra time.
      start_period: 90s


# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  lavalink_plugins:
    driver: local