# =============================================================
#  alembic.ini
#
#  Common commands (run from project root):
#
#    uv run alembic upgrade head        # apply all pending migrations
#    uv run alembic downgrade -1        # roll back one migration
#    uv run alembic revision --autogenerate -m "description" # Compares your current Python models against the existing database tables and auto-generates a pre-filled migration script.
#    uv run alembic revision -m "description" # Generates a completely blank migration script containing empty upgrade() and downgrade() functions for manual schema or data edits 
#  NOTICE: Don't use --autogenerate if there is no MetaData object or sequence of objects to the context (env.py or script.py.mako)
#    uv run alembic history             # list all migrations
#    uv run alembic current             # show applied revision
# =============================================================

[alembic]
script_location = alembic

# Migration filenames:  20240101_a1b2c3d4_create_guild_config.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left blank.
# env.py reads it from bot/config.py (DATABASE_URL in .env).
# Never hard-code credentials here.
sqlalchemy.url =

# Prepend sys.path with the project root so `from bot.config import settings`
# resolves correctly when running alembic from any working directory.
prepend_sys_path = .

# Timezone for migration timestamps.
timezone = UTC

# Max length of the slug portion of the filename.
truncate_slug_length = 40


# ── Logging ───────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S