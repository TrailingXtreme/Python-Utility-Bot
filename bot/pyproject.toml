[project]
name = "discord-bot"
version = "0.1.0"
description = "A simple template for building a beautiful discord bot with nextcord.Here I have also implemented the buttons, discord modals and select menus along with slash commands. This project is under progress so you have to wait for some time to get your wanted features."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ── Discord ───────────────────────────────────────────────────────────────
    # [voice] pulls in PyNaCl automatically — no separate PyNaCl pin needed.
    "discord-py[voice]>=2.7.1",

    # Button-based pagination used in Help / About cogs.
    # TODO (Phase 5): replace with custom discord.ui.View paginators to remove
    #                 this dependency entirely.
    "discord-ext-menus>=1.1",

    # ── Music — Lavalink 4 client ─────────────────────────────────────────────
    # Full API rewrite vs nextwave; Music cog is ported in Phase 6.
    # Requires the Lavalink 4.2.2 node — see docker-compose.yml.
    "wavelink>=3.5.2",

    # ── PostgreSQL ────────────────────────────────────────────────────────────
    "asyncpg>=0.31.0",          # async driver — used by the bot at runtime
    "alembic>=1.18.4",          # schema migrations; run: uv run alembic upgrade head
    "psycopg2-binary>=2.9.12",  # Alembic CLI only; never imported in bot code

    # ── Data Validation & Settings ────────────────────────────────────────────
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",   # reads .env; see bot/config.py

    # ── HTTP ──────────────────────────────────────────────────────────────────
    "aiohttp>=3.14.1",

    # ── Search — Algolia (Docs cog) ───────────────────────────────────────────
    # BREAKING CHANGE vs v2: import path changed in v3+.
    #   Old (v2): from algoliasearch.search_client import SearchClient
    #   New (v4): from algoliasearch.search.client  import SearchClient
    # The Docs cog WILL FAIL at import until updated in Phase 5.
    "algoliasearch>=4.42.0",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "humanfriendly>=10.0",
    "psutil>=7.2.2",
    "rapidfuzz>=3.14.5",

    # ── Calculator cog ────────────────────────────────────────────────────────
    # Maintained fork of TagScriptEngine; runs independently of discord.
    "advancedtagscriptengine>=3.2.2",

    # ── Charts (About / vote cog) ─────────────────────────────────────────────
    "quickchart-io>=2.0.0",

    # ── DNS ───────────────────────────────────────────────────────────────────
    # Was required by pymongo for SRV URLs; may still be an indirect dep of
    # aiohttp in some environments. Safe to remove if uv reports it unused.
    "dnspython>=2.8.0",
]


# ── Development dependencies (PEP 735) ────────────────────────────────────────
# Install with:  uv sync --group dev
[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",   # async test support for cog / DB tests
    "pytest-cov>=6.1.0",
    "ruff>=0.9.9",               # replaces flake8 + isort + pyupgrade in one tool
    "mypy>=1.15.0",
    "types-psutil>=7.0.0.20250218",
]


# ── uv configuration ──────────────────────────────────────────────────────────
[tool.uv]
# This is a pure application, not a library — uv should not install the project
# itself as a package into the virtual environment.
package = false


# ── Ruff — linting & formatting ──────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (catches common async/await mistakes)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length — handled by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
# Eval cog uses exec() and dynamic variable injection by design.
"bot/cogs/Eval/__init__.py" = ["B"]
# Cog __init__ files often have long import lists.
"bot/cogs/__init__.py"      = ["F401"]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false


# ── Mypy — type checking ──────────────────────────────────────────────────────
[tool.mypy]
python_version      = "3.12"
ignore_missing_imports = true   # many discord.py stubs are incomplete
warn_return_any     = true
warn_unused_ignores = true
# Start permissive; tighten per-module in Phase 5 as cogs are ported.
strict              = false


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"           # all async test functions run without @pytest.mark.asyncio
testpaths    = ["tests"]